plugins {
    id 'com.android.application'
}

// Pull dev-only settings from local.properties (gitignored).
// Copy local.properties.example → local.properties and fill in your LAN IP.
Properties localProps = new Properties()
File localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream -> localProps.load(stream) }
}

// Release signing credentials from keystore.properties (gitignored).
// Environment variables win over the file so CI can inject secrets instead.
Properties keystoreProps = new Properties()
File keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { stream -> keystoreProps.load(stream) }
}
def keystorePath = System.getenv('KEYSTORE_FILE') ?: keystoreProps.getProperty('storeFile')
def hasSigningConfig = keystorePath != null && rootProject.file(keystorePath).exists()

android {
    namespace 'bd.sammalani.alumni'
    compileSdk 35

    defaultConfig {
        applicationId "bd.sammalani.alumni"
        minSdk 21          // Android 5.0 — covers 99 %+ of active devices
        targetSdk 35     // Play Console minimum — API 35+ enforces edge-to-edge, see MainActivity#applyEdgeToEdgeInsets
        versionCode 5    // 1–4 are consumed; Play never lets a version code be reused
        versionName "1.0.0"

        // Production URL — override per buildType below.
        buildConfigField "String", "WEB_APP_URL", '"https://alumni.sammalani.edu.bd"'
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
                keyAlias System.getenv('KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
                keyPassword System.getenv('KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            // Falls back to the emulator alias; override in local.properties:
            //   dev.web_app_url=http://192.168.1.x:8080
            def devUrl = localProps.getProperty('dev.web_app_url', 'http://10.0.2.2:8080')
            buildConfigField "String", "WEB_APP_URL", "\"${devUrl}\""
        }
        release {
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TODO: switch to https://alumni.sammalani.edu.bd once the server has
            // a domain + TLS. A bare IP is baked into every install — if this
            // address ever changes, shipped apps break and cannot be redirected.
            buildConfigField "String", "WEB_APP_URL", '"http://103.165.162.229:8092"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Splash screen back-ported to API 21. On API 31+ it delegates to the OS.
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
