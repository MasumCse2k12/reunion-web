plugins {
    id 'com.android.application'
}

// Pull dev-only settings from local.properties (gitignored).
// Copy local.properties.example → local.properties and fill in your LAN IP.
Properties localProps = new Properties()
File localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream -> localProps.load(stream) }
}

// Release signing credentials from keystore.properties (gitignored).
// Environment variables win over the file so CI can inject secrets instead.
Properties keystoreProps = new Properties()
File keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { stream -> keystoreProps.load(stream) }
}
def keystorePath = System.getenv('KEYSTORE_FILE') ?: keystoreProps.getProperty('storeFile')
def hasSigningConfig = keystorePath != null && rootProject.file(keystorePath).exists()

// Production API base URL — the one place it is written down.
// Point it at the hostname Caddy holds the certificate for (PUBLIC_DOMAIN in
// the server's .env), not at an IP: an IP cannot have a public TLS certificate,
// and an IP baked into a shipped APK cannot be redirected if the server moves.
// Override without editing this file:  -PapiBaseUrl=…  or  API_BASE_URL=…
def prodApiBaseUrl = System.getenv('API_BASE_URL') ?:
        (project.findProperty('apiBaseUrl') ?: 'https://107.167.94.230/smbc')
def contactPhone = '01943177909'

// A release build must never ship a cleartext URL. Shipping one is what got
// versionCode 5 and 12 rejected under Play's User Data policy — this app sends
// phone numbers, OTP codes, auth tokens and photos. Fail the build here rather
// than wait a week to fail the review.
gradle.taskGraph.whenReady { graph ->
    boolean releasing = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (releasing && !prodApiBaseUrl.startsWith('https://')) {
        throw new GradleException(
                "Release builds require an https:// API_BASE_URL, got: ${prodApiBaseUrl}\n" +
                "Set it with -PapiBaseUrl=https://107.167.94.230/smbc or API_BASE_URL=…")
    }
}

android {
    namespace 'bd.sammalani.alumni'
    compileSdk 37

    defaultConfig {
        applicationId "bd.sammalani.alumni"
        minSdk 21          // Android 5.0 — covers 99 %+ of active devices
        targetSdk 37
        versionCode 24    // 5 = rejected WebView build; 12 = rejected targetSdk 35 build
        versionName "2.0.1"

        buildConfigField "String", "API_BASE_URL", "\"${prodApiBaseUrl}\""
        buildConfigField "String", "CONTACT_PHONE", "\"${contactPhone}\""
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
                keyAlias System.getenv('KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
                keyPassword System.getenv('KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            // Cleartext to a LAN address is fine here — src/debug/AndroidManifest.xml
            // permits it for debug builds only. Override in local.properties:
            //   dev.api_base_url=http://192.168.1.x:8090/smbc
            def devApi = localProps.getProperty('dev.api_base_url', prodApiBaseUrl)
            buildConfigField "String", "API_BASE_URL", "\"${devApi}\""
            buildConfigField "String", "CONTACT_PHONE", "\"${contactPhone}\""
        }
        release {
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", "\"${prodApiBaseUrl}\""
            buildConfigField "String", "CONTACT_PHONE", "\"${contactPhone}\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Splash screen back-ported to API 21. On API 31+ it delegates to the OS.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // HTTP client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    // Image loading (avatars, profile photos)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
