# Serves the built SPA. Mirrors what vercel.json and netlify.toml do on their
# platforms: every route falls back to index.html.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    # Vite fingerprints every file it emits into /assets, so the name changes
    # whenever the contents do and these can be cached for as long as we like.
    # One header, not `expires` as well: the two do not merge, they both get
    # sent, and a client is entitled to honour either.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file with a stable name. Cache it and a returning
    # visitor keeps loading yesterday's bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # React Router owns the URL space; nginx knows about no route but this one.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
