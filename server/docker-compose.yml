# Postgres and Redis for local development.
#
# Ports are deliberately off the defaults (5436, 6380) so this stack can run
# alongside whatever else is already on the machine without a clash.
services:
  postgres:
    image: postgres:17-alpine
    container_name: alumni-postgres
    environment:
      POSTGRES_DB: alumni
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: alumni
    ports:
      - "5436:5432"
    volumes:
      - alumni-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni -d alumni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alumni-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: alumni-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API — set MINIO_ENDPOINT=http://localhost:9000 in your IDE run config
      - "9001:9001"   # web console — http://localhost:9001
    volumes:
      - alumni-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alumni-pgdata:
  alumni-miniodata:
