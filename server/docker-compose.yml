# Postgres and Redis for local development.
#
# Ports are deliberately off the defaults (5436, 6380) so this stack can run
# alongside whatever else is already on the machine without a clash.
services:
  postgres:
    image: postgres:17-alpine
    container_name: alumni-postgres
    environment:
      POSTGRES_DB: alumni
      POSTGRES_USER: alumni
      POSTGRES_PASSWORD: alumni
    ports:
      - "5436:5432"
    volumes:
      - alumni-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumni -d alumni"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alumni-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  alumni-pgdata:
