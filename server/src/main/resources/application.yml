spring:
  application:
    name: alumni-service

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/alumni}
    username: ${DB_USER:alumni}
    password: ${DB_PASSWORD:alumni}
    hikari:
      # Sized for a service that is I/O bound on Postgres, not CPU bound.
      # Bigger is not faster: every idle connection is memory Postgres cannot
      # use for its cache.
      maximum-pool-size: ${DB_POOL_MAX:16}
      minimum-idle: 4
      connection-timeout: 5000
      pool-name: alumni-pool

  jpa:
    open-in-view: false            # no lazy loading in a template; every query is deliberate
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; drift fails at startup
    properties:
      hibernate:
        jdbc:
          batch_size: 50           # a bulk decision writes its review rows in one round trip
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
        # Uncomment when tuning; far too noisy to leave on.
        # generate_statistics: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  threads:
    virtual:
      # Java 21+ virtual threads: this service is almost entirely waiting on
      # Postgres and Redis, which is exactly the workload they are for.
      enabled: true

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/smbc}
  shutdown: graceful
  error:
    include-message: never          # errors go through the ProblemDetail handler
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      db:
        enabled: true
      redis:
        enabled: true
      diskspace:
        enabled: true
      ping:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # No default on purpose: an unset secret must stop the deployment, not sign
    # tokens with a value that is published in this file.
    secret: ${JWT_SECRET:72766e8b1ba67151e07fe82dc451277b2421440b96845582a565cdf60fd90994}
    issuer: sammalani-alumni
    member-access-ttl: PT12H
    member-refresh-ttl: P60D
    admin-access-ttl: PT8H
  otp:
    length: 6
    ttl: PT5M
    max-attempts: 5
    requests-per-hour: 5
    dev-code: ${OTP_DEV_CODE:}      # set only on a laptop; logs a warning when present
  security:
    max-failed-logins: 5
    lockout-duration: PT15M
  event:
    default-slug: reunion-2027
    first-batch: 1968
    last-batch: 2026
  cors:
    # Override via CORS_ORIGINS env var in production and docker. In dev, the
    # default includes localhost (Vite/preview) and the LAN IP for real-device
    # testing. Update the LAN IP when your network changes (ifconfig | grep "inet 192").
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://192.168.1.103:5173,http://192.168.1.103:8080}
  bootstrap:
    enabled: true
    username: ${BOOTSTRAP_ADMIN_USERNAME:superadmin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Sammilani@2027}
    name: ${BOOTSTRAP_ADMIN_NAME:Super Admin}
    phone: "01943177909"
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:alumni-photos}
    # Public base URL used to construct photo URLs returned in API responses.
    # In production this is typically your CDN / nginx reverse-proxy in front of MinIO.
    # In dev, use your machine's LAN IP so Android devices on the same Wi-Fi can load
    # photos. Update when your IP changes (ifconfig | grep "inet 192").
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://192.168.1.103:9000}

logging:
  level:
    bd.sammalani.alumni: ${LOG_LEVEL:INFO}
