# The whole platform on one machine: Postgres, Redis, the API and the web app.
#
#   cp .env.example .env      # then fill in JWT_SECRET
#   docker compose up --build
#
#   web   http://localhost:8080
#   api   http://localhost:8090   (Swagger UI at /swagger-ui.html)
#
# For day-to-day backend work you usually want the other file — server/docker-compose.yml
# runs only Postgres and Redis, and you run the service from your IDE against them.

name: sammalani-alumni

services:
  redis:
    image: redis:7-alpine
    # Cache and OTP store only — nothing here is worth an fsync, and losing it
    # costs a user one resend.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      # API on 9000 — default all interfaces for external access.
      # Set MINIO_BIND=127.0.0.1 in .env to restrict to loopback only.
      - "${MINIO_BIND:-0.0.0.0}:${MINIO_PORT:-9000}:9000"
      # Web console on 9001 (loopback only — open for ops, never public)
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./server
    image: sammalani/alumni-api:local
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://172.17.0.1:5432/alumni}
      DB_USER: alumni
      DB_PASSWORD: ${DB_PASSWORD:-alumni}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # No default, deliberately — an unset secret must stop the stack, not sign
      # tokens with a value published in a compose file.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      OTP_DEV_CODE: ${OTP_DEV_CODE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-alumni-photos}
      # In production, replace this with your public nginx/CDN URL in front of MinIO.
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
    # Default: all interfaces so the API is reachable externally.
    # Set API_BIND=127.0.0.1 in .env to restrict to loopback only.
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8090}:8090"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8090/smbc}
        VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-01943177909}
    image: sammalani/alumni-web:local
    # Default: all interfaces so the app is reachable externally.
    # Set WEB_BIND=127.0.0.1 in .env to restrict to loopback only.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    environment:
      WEB_PORT: "${WEB_PORT:-8080}"
    # No depends_on: the app still resolves everything from src/lib/api.ts and
    # localStorage, so it does not yet call the API. Add one when it does.
    restart: unless-stopped

volumes:
  miniodata:
