# The whole platform on one machine: Postgres, Redis, the API and the web app.
#
#   cp .env.example .env      # then fill in JWT_SECRET
#   docker compose up --build
#
# In production Caddy terminates TLS and is the only thing listening publicly:
#
#   https://$PUBLIC_DOMAIN/          web
#   https://$PUBLIC_DOMAIN/smbc      api   (Swagger UI at /smbc/swagger-ui.html)
#   https://$PUBLIC_DOMAIN/photos    profile photos out of MinIO
#
# The web, api and minio ports below stay on loopback so nothing bypasses TLS;
# reach them directly only over an SSH tunnel. Set WEB_BIND/API_BIND/MINIO_BIND
# to 0.0.0.0 for LAN device testing, never on a public host.
#
# For day-to-day backend work you usually want the other file — server/docker-compose.yml
# runs only Postgres and Redis, and you run the service from your IDE against them.

name: sammalani-alumni

services:
  redis:
    image: redis:7-alpine
    # Cache and OTP store only — nothing here is worth an fsync, and losing it
    # costs a user one resend.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      # API on 9000 — loopback only; the public route is Caddy's /photos.
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      # Web console on 9001 (loopback only — open for ops, never public)
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./server
    image: sammalani/alumni-api:local
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://172.17.0.1:5432/alumni}
      DB_USER: alumni
      DB_PASSWORD: ${DB_PASSWORD:-alumni}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # No default, deliberately — an unset secret must stop the stack, not sign
      # tokens with a value published in a compose file.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-superadmin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
      OTP_DEV_CODE: ${OTP_DEV_CODE:-}
      OTP_TTL: ${OTP_TTL:-PT5M}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_REQUESTS_PER_HOUR: ${OTP_REQUESTS_PER_HOUR:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${PUBLIC_DOMAIN}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-alumni-photos}
      # Public URL photos are served from — Caddy's /photos route, which strips
      # the prefix and forwards to MinIO. Must be https, or Android blocks the
      # image load and Play flags cleartext transmission of user content.
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-https://${PUBLIC_DOMAIN}/photos}
    # Loopback only — Caddy proxies the public /smbc route over TLS.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8090}:8090"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/smbc}
        VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-01943177909}
    image: sammalani/alumni-web:local
    # Loopback only — Caddy serves the app publicly over TLS.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    environment:
      WEB_PORT: "${WEB_PORT:-8080}"
    # No depends_on: the app still resolves everything from src/lib/api.ts and
    # localStorage, so it does not yet call the API. Add one when it does.
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    # Obtains and renews the Let's Encrypt certificate for PUBLIC_DOMAIN, then
    # reverse-proxies web, api and minio under it. Unset the domain and the
    # stack stops here rather than silently serving plaintext.
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env — see .env.example}
      # Must be non-empty — Caddy's global `email` directive rejects a blank value.
      ACME_EMAIL: ${ACME_EMAIL:-admin@${PUBLIC_DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if the host firewall drops UDP; clients fall back.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account keys. Losing this volume means
      # re-issuing on next start, and Let's Encrypt rate-limits that.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web
      - minio
    restart: unless-stopped

volumes:
  miniodata:
  caddydata:
  caddyconfig:
